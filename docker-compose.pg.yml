services:
  postgres:
    image: pgvector/pgvector:pg18-trixie
    container_name: syntopica-postgres
    restart: unless-stopped
    # autovacuum tuning (optimize-pg-storage): tighten vacuum triggers for the
    # high-churn tables (otel_spans ~820k inserts+deletes/day; embedding cache
    # churn) and raise cost limit so vacuum keeps up with write volume.
    # Defaults were 0.2 scale factor / cost_limit 200 — dead tuples piled up for
    # days and TOAST bloat multiplied storage 13x. Needs container recreate.
    command:
      - postgres
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_vacuum_insert_scale_factor=0.05
      - -c
      - autovacuum_vacuum_insert_threshold=500
      - -c
      - autovacuum_vacuum_cost_limit=2000
      - -c
      - wal_compression=on
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-syntopica}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-syntopica}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
