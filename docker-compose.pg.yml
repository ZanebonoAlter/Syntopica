services:
  postgres:
    image: pgvector/pgvector:pg18-trixie
    container_name: syntopica-postgres
    restart: unless-stopped
    # halfvec HNSW 索引构建/查询需要较大共享内存（默认 64MB 不够，
    # 维护期并行建 2560 维索引会要 ~534MB）。2026-11-04 tag-embedding-slow 验证加。
    shm_size: 1g
    # autovacuum tuning (optimize-pg-storage): tighten vacuum triggers for the
    # high-churn tables (otel_spans ~820k inserts+deletes/day; embedding cache
    # churn) and raise cost limit so vacuum keeps up with write volume.
    # Defaults were 0.2 scale factor / cost_limit 200 — dead tuples piled up for
    # days and TOAST bloat multiplied storage 13x. Needs container recreate.
    #
    # idle_in_transaction_session_timeout (fix-aux-label-idle-tx-cache D4):
    # hard guard against future "slow call inside a transaction" regressions —
    # the aux-label attach path now commits its transactions in milliseconds,
    # and the only legitimate long transaction (HardMergeTags row migration)
    # is pure SQL and finishes well within 60s. If a misfire ever shows up in
    # logs as "terminating connection due to idle-in-transaction timeout",
    # raise or drop this parameter. Needs container recreate (connection blip).
    command:
      - postgres
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_vacuum_insert_scale_factor=0.05
      - -c
      - autovacuum_vacuum_insert_threshold=500
      - -c
      - autovacuum_vacuum_cost_limit=2000
      - -c
      - wal_compression=on
      - -c
      - idle_in_transaction_session_timeout=60s
      # shared_buffers 128MB → 1GB（2026-11-25 fix-aux-label-dedup-ann 验收）：
      # semantic_labels merge halfvec HNSW 索引 218MB + topic_tag_embeddings identity
      # 索引 194MB = 412MB 索引集。512MB 装不下（预热完被挤掉，pg_prewarm 重跑仍
      # 返回全部 27k 页），实测冷读 ~278ms / 热读 5-13ms。1GB 可容索引 + 热页。
      # 启动期参数：改后必须 recreate 容器，ALTER SYSTEM + reload 不生效。
      - -c
      - shared_buffers=1GB
      # pg_prewarm autoprewarm（2026-11-25）：每 autoprewarm_interval 秒把 shared_buffers
      # 里的页 dump 到 $PGDATA/autoprewarm.blocks，重启后自动恢复——否则每次 recreate
      # 容器后 HNSW 索引（212MB）要从 SD 卡重新读，L2 召回首访问 ~278ms。
      # autoprewarm worker 依赖 shared_preload_libraries，必须 preload + 重启容器。
      - -c
      - shared_preload_libraries=pg_prewarm
      - -c
      - pg_prewarm.autoprewarm=on
      - -c
      - pg_prewarm.autoprewarm_interval=300s
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-syntopica}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-syntopica}
      # Pi 5 上每次 exec 都要走一遍 dockerd/containerd/runc 生命周期，10s 频率会
      # 让 daemon 持续烧 ~0.5 核 CPU；启动期用 start_interval 快检，稳态 60s 一次。
      interval: 60s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 5s
