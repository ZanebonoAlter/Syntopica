<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Syntopica 运转方式：LLM 花在哪里</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #faf7f2;
    --ink: #1a1a1a;
    --ink-secondary: #5a5a5a;
    --muted: #7d6e5b;
    --soft: #9a8a74;
    --accent: #d94a4a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper);
    font-family: 'Geist', 'Noto Sans SC', 'Droid Sans Fallback', sans-serif;
    color: var(--ink);
    display: flex; flex-direction: column; align-items: center;
    padding: 3rem 1.5rem 4rem;
  }
  .eyebrow {
    font-family: 'Geist Mono', monospace;
    font-size: 8px; font-weight: 500; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--soft);
    margin-bottom: 0.6rem; text-align: center;
  }
  h1 {
    font-family: 'Instrument Serif', 'Noto Serif SC', serif;
    font-weight: 400; font-size: 1.75rem; text-align: center;
    margin-bottom: 2rem;
  }
  svg { display: block; }
</style>
</head>
<body>
  <p class="eyebrow">Syntopica · How It Runs</p>
  <h1>一次日常使用：LLM 花在哪里</h1>

  <svg width="900" height="692" viewBox="0 0 900 692" role="img"
       aria-labelledby="llm-spend-title llm-spend-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="llm-spend-title">Syntopica 一次日常使用中的 LLM 触点</title>
    <desc id="llm-spend-desc">以用户操作为轴的顺序图：文章进入系统时整理一次，此后板块匹配零 LLM 调用并带匹配解释；LLM 只在单篇整理、板块日报叙事与手动触发的信号研究三处出现。</desc>

    <defs>
      <marker id="arr-filled" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#7d6e5b"/>
      </marker>
      <marker id="arr-filled-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#d94a4a"/>
      </marker>
      <marker id="arr-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#7d6e5b" stroke-width="1.2"/>
      </marker>
    </defs>

    <!-- paper -->
    <rect width="100%" height="100%" fill="#faf7f2"/>

    <!-- ── lifelines (dashed, behind everything) ─────────── -->
    <line x1="128" y1="84" x2="128" y2="596" stroke="rgba(26,26,26,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="372" y1="84" x2="372" y2="596" stroke="rgba(26,26,26,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="600" y1="84" x2="600" y2="596" stroke="rgba(26,26,26,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="800" y1="84" x2="800" y2="596" stroke="rgba(26,26,26,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- ── phase labels (left margin, Chinese → sans register) ── -->
    <text x="16" y="124" fill="#9a8a74" font-size="12" font-weight="500"
          font-family="'Geist','Noto Sans SC','Droid Sans Fallback',sans-serif">① 每篇 · 一次</text>
    <text x="16" y="280" fill="#9a8a74" font-size="12" font-weight="500"
          font-family="'Geist','Noto Sans SC','Droid Sans Fallback',sans-serif">② 打开板块</text>
    <text x="16" y="400" fill="#9a8a74" font-size="12" font-weight="500"
          font-family="'Geist','Noto Sans SC','Droid Sans Fallback',sans-serif">③ 日报与分析</text>

    <!-- ── messages (arrows) ──────────────────────────────── -->
    <!-- 1 用户→系统 刷新订阅 -->
    <line x1="128" y1="132" x2="364" y2="132" stroke="#7d6e5b" stroke-width="1.2" marker-end="url(#arr-filled)"/>
    <rect x="164" y="108" width="152" height="18" rx="2" fill="#faf7f2"/>
    <text x="240" y="122" fill="#5a5a5a" font-size="12" font-weight="500"
          font-family="'Geist','Noto Sans SC','Droid Sans Fallback',sans-serif" text-anchor="middle">刷新订阅 · 正文补全</text>

    <!-- 2 系统→LLM 单篇整理 -->
    <line x1="372" y1="168" x2="792" y2="168" stroke="#7d6e5b" stroke-width="1.2" marker-end="url(#arr-filled)"/>
    <rect x="440" y="144" width="284" height="18" rx="2" fill="#faf7f2"/>
    <text x="582" y="158" fill="#5a5a5a" font-size="12" font-weight="500"
          font-family="'Geist','Noto Sans SC','Droid Sans Fallback',sans-serif" text-anchor="middle">单篇整理（摘要 · 标签）— 每篇一次</text>

    <!-- 3 LLM-->系统 标签与整理稿 -->
    <line x1="800" y1="204" x2="380" y2="204" stroke="#7d6e5b" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arr-filled)"/>
    <rect x="500" y="180" width="176" height="18" rx="2" fill="#faf7f2"/>
    <text x="588" y="194" fill="#9a8a74" font-size="12"
          font-family="'Geist','Noto Sans SC','Droid Sans Fallback',sans-serif" text-anchor="middle">标签 · 整理稿</text>

    <!-- 4 系统→向量 Embedding -->
    <line x1="372" y1="240" x2="592" y2="240" stroke="#7d6e5b" stroke-width="1.2" marker-end="url(#arr-filled)"/>
    <rect x="392" y="216" width="180" height="18" rx="2" fill="#faf7f2"/>
    <text x="482" y="230" fill="#5a5a5a" font-size="12" font-weight="500"
          font-family="'Geist','Noto Sans SC','Droid Sans Fallback',sans-serif" text-anchor="middle">Embedding — 每篇一次</text>

    <!-- 5 用户→系统 打开板块 -->
    <line x1="128" y1="288" x2="364" y2="288" stroke="#7d6e5b" stroke-width="1.2" marker-end="url(#arr-filled)"/>
    <rect x="152" y="264" width="188" height="18" rx="2" fill="#faf7f2"/>
    <text x="246" y="278" fill="#5a5a5a" font-size="12" font-weight="500"
          font-family="'Geist','Noto Sans SC','Droid Sans Fallback',sans-serif" text-anchor="middle">打开板块 · 看今天</text>

    <!-- 6 系统→向量 标签×板块匹配 -->
    <line x1="372" y1="324" x2="592" y2="324" stroke="#7d6e5b" stroke-width="1.2" marker-end="url(#arr-filled)"/>
    <rect x="400" y="300" width="164" height="18" rx="2" fill="#faf7f2"/>
    <text x="482" y="314" fill="#5a5a5a" font-size="12" font-weight="500"
          font-family="'Geist','Noto Sans SC','Droid Sans Fallback',sans-serif" text-anchor="middle">标签 × 板块匹配</text>

    <!-- 7 系统-->用户 归类结果（headline accent） -->
    <line x1="372" y1="360" x2="136" y2="360" stroke="#d94a4a" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arr-filled-accent)"/>
    <rect x="140" y="336" width="232" height="18" rx="2" fill="#faf7f2"/>
    <text x="256" y="350" fill="#d94a4a" font-size="12" font-weight="600"
          font-family="'Geist','Noto Sans SC','Droid Sans Fallback',sans-serif" text-anchor="middle">归类 + 匹配解释（0 次 LLM）</text>

    <!-- 8 用户→系统 生成日报 -->
    <line x1="128" y1="408" x2="364" y2="408" stroke="#7d6e5b" stroke-width="1.2" marker-end="url(#arr-filled)"/>
    <rect x="188" y="384" width="116" height="18" rx="2" fill="#faf7f2"/>
    <text x="246" y="398" fill="#5a5a5a" font-size="12" font-weight="500"
          font-family="'Geist','Noto Sans SC','Droid Sans Fallback',sans-serif" text-anchor="middle">生成日报</text>

    <!-- 9 系统→LLM 板块日叙事 -->
    <line x1="372" y1="444" x2="792" y2="444" stroke="#7d6e5b" stroke-width="1.2" marker-end="url(#arr-filled)"/>
    <rect x="428" y="420" width="308" height="18" rx="2" fill="#faf7f2"/>
    <text x="582" y="434" fill="#5a5a5a" font-size="12" font-weight="500"
          font-family="'Geist','Noto Sans SC','Droid Sans Fallback',sans-serif" text-anchor="middle">板块日叙事 — 每板块 · 每天 · 一次</text>

    <!-- 10 系统-->用户 日报等 -->
    <line x1="372" y1="480" x2="136" y2="480" stroke="#7d6e5b" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arr-filled)"/>
    <rect x="152" y="456" width="200" height="18" rx="2" fill="#faf7f2"/>
    <text x="252" y="470" fill="#9a8a74" font-size="12"
          font-family="'Geist','Noto Sans SC','Droid Sans Fallback',sans-serif" text-anchor="middle">日报 · 泳道 · 话题演进</text>

    <!-- 11 用户→系统 信号深入分析 -->
    <line x1="128" y1="528" x2="364" y2="528" stroke="#7d6e5b" stroke-width="1.2" marker-end="url(#arr-filled)"/>
    <rect x="140" y="504" width="212" height="18" rx="2" fill="#faf7f2"/>
    <text x="246" y="518" fill="#5a5a5a" font-size="12" font-weight="500"
          font-family="'Geist','Noto Sans SC','Droid Sans Fallback',sans-serif" text-anchor="middle">信号 · 深入分析（点击触发）</text>

    <!-- 12 系统⇢LLM 预算研究（async open） -->
    <line x1="372" y1="564" x2="792" y2="564" stroke="#7d6e5b" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arr-open)"/>
    <rect x="420" y="540" width="324" height="18" rx="2" fill="#faf7f2"/>
    <text x="582" y="554" fill="#5a5a5a" font-size="12" font-weight="500"
          font-family="'Geist','Noto Sans SC','Droid Sans Fallback',sans-serif" text-anchor="middle">预算研究（约 40 轮工具循环）· 仅手动</text>

    <!-- ── activation bars ────────────────────────────────── -->
    <!-- 用户 -->
    <rect x="124" y="128" width="8" height="16" fill="rgba(26,26,26,0.06)" stroke="#7d6e5b" stroke-width="0.8"/>
    <rect x="124" y="284" width="8" height="80" fill="rgba(26,26,26,0.06)" stroke="#7d6e5b" stroke-width="0.8"/>
    <rect x="124" y="404" width="8" height="80" fill="rgba(26,26,26,0.06)" stroke="#7d6e5b" stroke-width="0.8"/>
    <rect x="124" y="524" width="8" height="16" fill="rgba(26,26,26,0.06)" stroke="#7d6e5b" stroke-width="0.8"/>
    <!-- Syntopica -->
    <rect x="368" y="128" width="8" height="120" fill="rgba(26,26,26,0.06)" stroke="#7d6e5b" stroke-width="0.8"/>
    <rect x="368" y="284" width="8" height="80" fill="rgba(26,26,26,0.06)" stroke="#7d6e5b" stroke-width="0.8"/>
    <rect x="368" y="404" width="8" height="80" fill="rgba(26,26,26,0.06)" stroke="#7d6e5b" stroke-width="0.8"/>
    <rect x="368" y="524" width="8" height="44" fill="rgba(26,26,26,0.06)" stroke="#7d6e5b" stroke-width="0.8"/>
    <!-- 标签·向量层 -->
    <rect x="596" y="236" width="8" height="12" fill="rgba(26,26,26,0.06)" stroke="#7d6e5b" stroke-width="0.8"/>
    <rect x="596" y="320" width="8" height="12" fill="rgba(26,26,26,0.06)" stroke="#7d6e5b" stroke-width="0.8"/>
    <!-- LLM -->
    <rect x="796" y="164" width="8" height="44" fill="rgba(26,26,26,0.06)" stroke="#7d6e5b" stroke-width="0.8"/>
    <rect x="796" y="440" width="8" height="12" fill="rgba(26,26,26,0.06)" stroke="#7d6e5b" stroke-width="0.8"/>
    <rect x="796" y="560" width="8" height="12" fill="rgba(26,26,26,0.06)" stroke="#7d6e5b" stroke-width="0.8"/>

    <!-- ── actors (boxes on top) ──────────────────────────── -->
    <!-- 用户 (input) -->
    <rect x="48" y="36" width="160" height="48" rx="6" fill="rgba(154,138,116,0.10)" stroke="#9a8a74" stroke-width="1"/>
    <rect x="56" y="42" width="40" height="12" rx="2" fill="none" stroke="rgba(154,138,116,0.40)" stroke-width="0.8"/>
    <text x="76" y="51" fill="rgba(122,106,86,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
    <text x="128" y="68" fill="#1a1a1a" font-size="13" font-weight="600" font-family="'Geist','Noto Sans SC','Droid Sans Fallback',sans-serif" text-anchor="middle">用户</text>

    <!-- Syntopica (backend) -->
    <rect x="292" y="36" width="160" height="48" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <rect x="300" y="42" width="56" height="12" rx="2" fill="none" stroke="rgba(26,26,26,0.30)" stroke-width="0.8"/>
    <text x="328" y="51" fill="rgba(26,26,26,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SYSTEM</text>
    <text x="372" y="68" fill="#1a1a1a" font-size="13" font-weight="600" font-family="'Geist','Noto Sans SC','Droid Sans Fallback',sans-serif" text-anchor="middle">Syntopica</text>

    <!-- 标签·向量层 (store) -->
    <rect x="520" y="36" width="160" height="48" rx="6" fill="rgba(26,26,26,0.05)" stroke="#7d6e5b" stroke-width="1"/>
    <rect x="528" y="42" width="44" height="12" rx="2" fill="none" stroke="rgba(125,110,91,0.40)" stroke-width="0.8"/>
    <text x="550" y="51" fill="rgba(125,110,91,0.85)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOCAL</text>
    <text x="600" y="68" fill="#1a1a1a" font-size="13" font-weight="600" font-family="'Geist','Noto Sans SC','Droid Sans Fallback',sans-serif" text-anchor="middle">标签 · 向量层</text>

    <!-- LLM (external) -->
    <rect x="720" y="36" width="160" height="48" rx="6" fill="rgba(26,26,26,0.03)" stroke="rgba(26,26,26,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="728" y="42" width="32" height="12" rx="2" fill="none" stroke="rgba(26,26,26,0.25)" stroke-width="0.8"/>
    <text x="744" y="51" fill="rgba(26,26,26,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
    <text x="800" y="68" fill="#1a1a1a" font-size="13" font-weight="600" font-family="'Geist','Noto Sans SC','Droid Sans Fallback',sans-serif" text-anchor="middle">LLM 能力路由</text>

    <!-- ── editorial callout（设计哲学旁注，斜体衬线；叙事口径回溯 docs/research/ssp-article 讨论红线）── -->
    <text x="784" y="626" fill="#1a1a1a" font-size="14" font-style="italic"
          font-family="'Instrument Serif','Noto Serif SC',serif" text-anchor="end">纯 LLM：每天从正文重新开始；Syntopica：从沉淀的标签与向量继续</text>
    <path d="M 792 630 Q 800 606 800 580" fill="none" stroke="rgba(26,26,26,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
    <circle cx="800" cy="578" r="2" fill="#1a1a1a"/>

    <!-- ── legend（底部横条）───────────────────────────────── -->
    <line x1="48" y1="648" x2="852" y2="648" stroke="rgba(26,26,26,0.10)" stroke-width="0.8"/>
    <text x="48" y="670" fill="#7d6e5b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

    <line x1="120" y1="666" x2="148" y2="666" stroke="#7d6e5b" stroke-width="1.2" marker-end="url(#arr-filled)"/>
    <text x="154" y="670" fill="#5a5a5a" font-size="12" font-family="'Geist','Noto Sans SC','Droid Sans Fallback',sans-serif">调用</text>

    <line x1="212" y1="666" x2="240" y2="666" stroke="#7d6e5b" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arr-filled)"/>
    <text x="246" y="670" fill="#5a5a5a" font-size="12" font-family="'Geist','Noto Sans SC','Droid Sans Fallback',sans-serif">返回</text>

    <line x1="304" y1="666" x2="332" y2="666" stroke="#7d6e5b" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arr-open)"/>
    <text x="338" y="670" fill="#5a5a5a" font-size="12" font-family="'Geist','Noto Sans SC','Droid Sans Fallback',sans-serif">按需 / 异步</text>

    <line x1="436" y1="666" x2="464" y2="666" stroke="#d94a4a" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arr-filled-accent)"/>
    <text x="470" y="670" fill="#5a5a5a" font-size="12" font-family="'Geist','Noto Sans SC','Droid Sans Fallback',sans-serif">板块匹配（0 次 LLM · 本地计算）</text>
  </svg>
</body>
</html>
