function exportDialog(){openDialog('md','导出候选 · 示例预览','只展示分享边界，不生成、下载或复制真实配置。',(body,foot)=>{
body.append(notice('默认排除私有来源与凭据','不导出订阅、兴趣、阅读行为。用户名、密码、查询参数与片段会被移除。'));
const label=el('label','toggle');const input=el('input');input.type='checkbox';label.append(input,el('span','','包含私有示例来源（仅本次内存预览）'));body.append(label);const state=selectField('预览演示状态',[['normal','正常预览'],['error','生成错误'],['empty','空结果'],['loading','生成中']],demo);body.append(state.label);const summary=el('p','caption');const output=el('pre','preview');output.setAttribute('aria-live','polite');body.append(summary,output);const make=button('更新模拟预览',()=>{preview();toast('预览已更新。未生成任何真实配置文件。');});
function preview(){const mode=state.input.value;make.disabled=mode!=='normal';if(mode!=='normal'){summary.textContent='未生成真实配置';output.textContent=mode==='error'?'模拟预览失败：候选序列化异常，可切回正常预览重试。':mode==='loading'?'正在生成示例预览…（切换正常状态结束）':'没有可导出的条目。';return;}const rows=catalog.filter(c=>input.checked||!c.private);summary.textContent=rows.length+' 条将出现在预览中 · '+(catalog.length-rows.length)+' 条私有来源已排除';const sanitized=rows.map(c=>{let address=c.url;try{const u=new URL(address);u.username='';u.password='';u.search='';u.hash='';address=u.toString();}catch{address='[地址不可移植，已省略]';}return{name:c.name,address,participates:c.enabled};});output.textContent='仅为演示，不是正式配置格式\n'+JSON.stringify({example_only:true,candidates:sanitized},null,2);}
input.addEventListener('change',preview);state.input.addEventListener('change',preview);preview();const download=button('下载配置（原型未提供）',()=>{});download.disabled=true;download.title='只提供内存预览，不生成真实文件';body.append(el('p','caption','下载功能未模拟，因此禁用。本 change 的正式配置格式由后续设计合同定义。'));foot.append(download,make,button('完成',closeDialog,'btn primary'));
});}
function renderInterests(panel){panel.append(sectionTop('兴趣有来处，也会慢慢淡去','每次问答独立记录，不揉成一个看不清来源的画像。'));
if(demo==='loading'){panel.append(empty('正在加载兴趣记录','固定演示状态；切换正常结果即可返回。'));return;}if(demo==='empty'){panel.append(empty('还没有问答兴趣记录','记录出现后会分别展示归属、时间与参与状态。这里不会虚构兴趣权重。'));return;}if(demo==='error')panel.append(notice('兴趣记录暂未更新','保留上次记录；服务异常不会将兴趣标为已衰减。'));
panel.append(notice('版块与行为是基础，问答为它们补充线索','兴趣会随时间与阅读画像的成熟逐步降低参与。本页不展示虚构百分比，不提供种子删除等额外操作。'));
const entries=[{day:'08',month:'2026 / 09',title:'想了解小团队的软件实践',board:'归属版块 · 软件与工具',time:'09-08 09:10',state:'参与推荐',text:'近期问答补充，与相关版块一起参与候选发现。'}, {day:'06',month:'2026 / 09',title:'城市里有哪些独立出版与书店？',board:'未匹配版块 · 独立保留',time:'09-06 20:35',state:'参与推荐',text:'没有强行挂到其他标签下，保留这一条独立兴趣。'}, {day:'12',month:'2026 / 07',title:'想看看长途骑行的装备与记录',board:'未匹配版块 · 独立保留',time:'07-12 16:20',state:'已衰减',text:'随时间与阅读画像成熟降低参与，记录保留；不等于主动拒绝。'}];
for(const title of [...askEntries].reverse())entries.unshift({day:'今',month:'本次演示',title,board:'未匹配版块 · 独立保留',time:'刚刚（示例）',state:'参与推荐',text:'本次手动查询形成的独立记录；不由 AI 判断是否长期兴趣。'});
for(const item of entries){const row=el('article','interest'+(item.state==='已衰减'?' faded':''));const date=el('div','interest-date',item.day);date.append(el('small','',item.month));const info=el('div');info.append(el('h3','',item.title),el('p','',item.board),el('p','',item.text));const state=el('div','interest-state');state.append(badge(item.state,item.state==='参与推荐'),el('small','','记录于 '+item.time));row.append(date,info,state);panel.append(row);}panel.append(el('p','caption','以上时间、归属与参与状态均为示例，不代表实际画像；具体衰减阈值不由此原型决定。'));
}
function openDialog(size,title,description,build){returnFocus=document.activeElement;const d=$('modal');d.dataset.size=size;const content=$('modal-content');content.replaceChildren();const head=el('div','dialog-head');const text=el('div');const h=el('h2','',title);h.id='dialog-title';const desc=el('p','',description);desc.id='dialog-desc';text.append(h,desc);const x=button('×',closeDialog,'btn quiet');x.setAttribute('aria-label','关闭弹窗');head.append(text,x);const body=el('div','dialog-body');const foot=el('div','dialog-foot');build(body,foot);content.append(head,body,foot);d.showModal();const first=body.querySelector('input:not([readonly]),select,textarea');if(first)first.focus();else x.focus();}
function closeDialog(){$('modal').close();}
$('modal').addEventListener('close',()=>{if(returnFocus?.isConnected)returnFocus.focus();else document.querySelector('[data-tab="'+tab+'"]').focus();});
function switchTab(next){tab=next;render();document.querySelector('[data-tab="'+tab+'"]').focus();}
for(const b of document.querySelectorAll('[data-tab]')){b.addEventListener('click',()=>switchTab(b.dataset.tab));b.addEventListener('keydown',e=>{const order=['recommend','library','interest'];let index=order.indexOf(tab);if(e.key==='ArrowRight')index=(index+1)%3;else if(e.key==='ArrowLeft')index=(index+2)%3;else if(e.key==='Home')index=0;else if(e.key==='End')index=2;else return;e.preventDefault();switchTab(order[index]);});}
$('theme').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'editorial';$('theme').textContent=dark?'◐ 浅色':'◐ 深色';$('theme').setAttribute('aria-label',dark?'切换到浅色主题':'切换到深色主题');});
$('demo').addEventListener('change',e=>{clearTimeout(refreshTimer);refreshing=false;demo=e.target.value;render();toast('已切换为'+e.target.selectedOptions[0].textContent+'演示，内存资料保留。');});
$('reset').addEventListener('click',()=>{reset();toast('已恢复初始示例数据。');});
reset();
</script>
</body>
</html>
