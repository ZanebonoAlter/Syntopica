<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一个回合内的约束注入与增量门禁</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #7a8399;
      --accent: #eb6c36; --accent-tint: rgba(235,108,54,0.08);
      --sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --serif: 'Instrument Serif', 'Noto Serif SC', serif;
      --mono: 'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1240px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    svg { display: block; width: 100%; min-width: 900px; }
    .msg-label { fill: var(--soft); font: 500 12px var(--sans); text-anchor: middle; }
    .msg-label-mono { fill: var(--muted); font: 400 8px var(--mono); text-anchor: middle; letter-spacing: 0.08em; }
    .guard { fill: var(--muted); font: 500 12px var(--sans); }
    .legend-title { fill: var(--muted); font: 400 8px var(--mono); letter-spacing: 0.18em; }
    .legend-item { fill: var(--muted); font: 500 12px var(--sans); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>一个回合内：约束怎么进、门禁怎么查</h1>

    <svg viewBox="0 0 1080 812" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="turn-gate-sequence-title turn-gate-sequence-desc">
      <title id="turn-gate-sequence-title">一个回合内的约束注入与增量门禁</title>
      <desc id="turn-gate-sequence-desc">时序图展示 agent 的一个回合：constraint-injection 在回合开始把约束注入 system prompt，agent 调工具改代码，turn_end 触发 quality-gate 做增量检查，失败以 steer 喂回，全程事件记账落 events.db。</desc>
      <defs>
        <pattern id="tgs-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="tgs-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="tgs-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="tgs-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>
      <rect width="1080" height="812" fill="#f5f5f5"/>
      <rect width="1080" height="812" fill="url(#tgs-dots)" opacity="0.55"/>

      <!-- ===== LIFELINES (behind everything) ===== -->
      <line x1="110" y1="120" x2="110" y2="736" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="325" y1="120" x2="325" y2="736" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="760" y1="120" x2="760" y2="736" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="950" y1="120" x2="950" y2="736" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ===== ACTIVATION BARS ===== -->
      <rect x="106" y="150" width="8" height="246" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="321" y="214" width="8" height="94" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="756" y="398" width="8" height="318" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="946" y="706" width="8" height="18" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- ===== MESSAGE ARROWS (before labels) ===== -->
      <!-- M0 self: turn starts -->
      <path d="M 118 158 L 162 158 L 162 190 L 118 190" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tgs-arrow)"/>
      <!-- M1: Agent -> CI -->
      <line x1="114" y1="222" x2="321" y2="222" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tgs-arrow)"/>
      <!-- M2 self: CI snapshot diff -->
      <path d="M 333 246 L 377 246 L 377 278 L 333 278" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tgs-arrow)"/>
      <!-- M3 return: CI -> Agent -->
      <line x1="321" y1="304" x2="114" y2="304" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#tgs-arrow)"/>
      <!-- M4 self: Agent edits -->
      <path d="M 118 338 L 162 338 L 162 370 L 118 370" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tgs-arrow)"/>
      <!-- M5: Agent -> QG -->
      <line x1="114" y1="398" x2="756" y2="398" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tgs-arrow)"/>
      <!-- M6 self: QG routing -->
      <path d="M 768 430 L 812 430 L 812 462 L 768 462" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tgs-arrow)"/>
      <!-- M7 self: QG runs checks -->
      <path d="M 768 484 L 812 484 L 812 516 L 768 516" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tgs-arrow)"/>
      <!-- M8: QG -> Agent (steer, headline accent) -->
      <line x1="756" y1="588" x2="114" y2="588" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#tgs-arrow-accent)"/>
      <!-- M9: QG -> Agent (silent pass) -->
      <line x1="756" y1="660" x2="114" y2="660" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#tgs-arrow)"/>
      <!-- M10: QG -> events.db (async ledger write) -->
      <line x1="764" y1="712" x2="946" y2="712" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#tgs-arrow-open)"/>

      <!-- ===== LABELS (masks behind text) ===== -->
      <rect x="170" y="158" width="124" height="16" rx="2" fill="#f5f5f5"/>
      <text x="232" y="170" class="msg-label">新输入 · steer 触发</text>

      <rect x="164" y="204" width="106" height="12" rx="2" fill="#f5f5f5"/>
      <text x="217" y="214" class="msg-label-mono">BEFORE_AGENT_START</text>

      <rect x="385" y="246" width="126" height="16" rx="2" fill="#f5f5f5"/>
      <text x="448" y="258" class="msg-label">快照 diff · 指纹去重</text>

      <rect x="135" y="282" width="165" height="16" rx="2" fill="#f5f5f5"/>
      <text x="217" y="294" class="msg-label">稳定层进 system prompt</text>

      <rect x="170" y="338" width="124" height="16" rx="2" fill="#f5f5f5"/>
      <text x="232" y="350" class="msg-label">edit · bash 改代码</text>

      <rect x="509" y="380" width="66" height="12" rx="2" fill="#f5f5f5"/>
      <text x="542" y="390" class="msg-label-mono">TURN_END</text>

      <rect x="820" y="430" width="64" height="16" rx="2" fill="#f5f5f5"/>
      <text x="852" y="442" class="msg-label">增量路由</text>

      <rect x="820" y="478" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="876" y="488" class="msg-label-mono">LINT→VET·BUILD·TEST</text>

      <rect x="418" y="566" width="249" height="16" rx="2" fill="#f5f5f5"/>
      <text x="542" y="578" class="msg-label">steer 喂回：[回归]必修 / [中间态]可续</text>

      <rect x="480" y="638" width="124" height="16" rx="2" fill="#f5f5f5"/>
      <text x="542" y="650" class="msg-label">静默放行 · 不打扰</text>

      <rect x="790" y="690" width="130" height="16" rx="2" fill="#f5f5f5"/>
      <text x="855" y="702" class="msg-label">gate.check 记账 · 采样</text>

      <!-- ===== ALT FRAGMENT ===== -->
      <rect x="90" y="532" width="710" height="148" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="90" y="532" width="44" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="112" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
      <text x="122" y="562" class="guard">[有失败]</text>
      <line x1="98" y1="610" x2="792" y2="610" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="122" y="634" class="guard">[纯文档 · 零变化]</text>

      <!-- ===== ACTOR BOXES (after arrows/labels) ===== -->
      <rect x="30" y="64" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="30" y="64" width="160" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="38" y="72" width="32" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="54" y="81" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TURN</text>
      <text x="110" y="98" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">Agent 回合</text>
      <text x="110" y="113" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pi · LLM</text>

      <rect x="245" y="64" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="245" y="64" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="253" y="72" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="275" y="81" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INJECT</text>
      <text x="325" y="98" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">constraint-injection</text>
      <text x="325" y="113" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">system prompt</text>

      <rect x="680" y="64" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="64" width="160" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="688" y="72" width="36" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="706" y="81" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
      <text x="760" y="98" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">quality-gate</text>
      <text x="760" y="113" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">turn_end</text>

      <rect x="870" y="64" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="870" y="64" width="160" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="878" y="72" width="46" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="901" y="81" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LEDGER</text>
      <text x="950" y="98" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">events.db 账本</text>
      <text x="950" y="113" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SQLite · TTL 30d</text>

      <!-- ===== LEGEND ===== -->
      <line x1="40" y1="748" x2="1040" y2="748" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="768" class="legend-title">LEGEND</text>
      <line x1="60" y1="792" x2="88" y2="792" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tgs-arrow)"/>
      <text x="98" y="796" class="legend-item">同步调用 / 事件</text>
      <line x1="238" y1="792" x2="266" y2="792" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#tgs-arrow)"/>
      <text x="276" y="796" class="legend-item">返回 · 异步</text>
      <line x1="408" y1="792" x2="436" y2="792" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#tgs-arrow-accent)"/>
      <text x="446" y="796" class="legend-item">steer 关键反馈</text>
      <rect x="600" y="784" width="4" height="16" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="614" y="796" class="legend-item">激活（持锁处理）</text>
    </svg>
  </main>
</body>
</html>
