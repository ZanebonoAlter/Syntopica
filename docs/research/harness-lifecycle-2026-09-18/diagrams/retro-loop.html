<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>harness 复盘闭环</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #7a8399;
      --accent: #eb6c36; --accent-tint: rgba(235,108,54,0.08);
      --sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --serif: 'Instrument Serif', 'Noto Serif SC', serif;
      --mono: 'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    svg { display: block; width: 100%; min-width: 900px; }
    .ring { fill: none; stroke: var(--muted); stroke-width: 1.2; }
    .spoke { fill: none; stroke: var(--soft); stroke-width: 1; stroke-dasharray: 5 4; }
    .station { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
    .station.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    .hub { fill: var(--ink); }
    .node-name { fill: var(--ink); font: 600 12px var(--sans); text-anchor: middle; }
    .focal-name { fill: var(--accent); }
    .sublabel { fill: var(--soft); font: 500 12px var(--sans); text-anchor: middle; }
    .hub-name { fill: var(--paper); font: 600 16px var(--sans); text-anchor: middle; }
    .hub-sub { fill: var(--paper); opacity: 0.72; font: 400 8px var(--mono); text-anchor: middle; letter-spacing: 0.06em; }
    .spoke-label { fill: var(--soft); font: 500 12px var(--sans); text-anchor: middle; }
    .legend-title { fill: var(--muted); font: 400 8px var(--mono); letter-spacing: 0.18em; }
    .legend-item { fill: var(--muted); font: 500 12px var(--sans); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Loop · Diagram Design</p>
    <h1>harness 复盘闭环：从事实账本到规则改进</h1>

    <svg viewBox="0 0 1040 740" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="retro-loop-title retro-loop-desc">
      <title id="retro-loop-title">harness 复盘闭环</title>
      <desc id="retro-loop-desc">环形图展示 harness 复盘闭环：扩展把门禁与裁决事件写入中央事实账本，harness-retro 报告只读聚类失败并产出改进项，改进项经 openspec change 修改规则，再落基线快照做前后对比回检，然后进入下一轮记账。</desc>
      <defs>
        <pattern id="retro-loop-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="retro-loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="retro-loop-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a8399"/></marker>
      </defs>
      <rect width="1040" height="740" fill="#f5f5f5"/>
      <rect width="1040" height="740" fill="url(#retro-loop-dots)" opacity="0.55"/>

      <!-- Solid clockwise ring: five arcs on the same r=240 station circle. -->
      <path class="ring" d="M600.000 113.726 A240 240 0 0 1 734.709 232.761" marker-end="url(#retro-loop-arrow)"/>
      <path class="ring" d="M756.267 297.836 A240 240 0 0 1 697.735 501.277" marker-end="url(#retro-loop-arrow)"/>
      <path class="ring" d="M600.311 566.164 A240 240 0 0 1 440.821 566.563" marker-end="url(#retro-loop-arrow)"/>
      <path class="ring" d="M343.074 502.164 A240 240 0 0 1 283.525 299.018" marker-end="url(#retro-loop-arrow)"/>
      <path class="ring" d="M304.758 233.836 A240 240 0 0 1 438.870 114.129" marker-end="url(#retro-loop-arrow)"/>

      <!-- Dashed write-backs: station inner edge to 6px before the hub stroke. -->
      <path class="spoke" d="M520.000 132.000 L520.000 282.000" marker-end="url(#retro-loop-arrow-soft)"/>
      <path class="spoke" d="M637.819 502.164 L561.307 396.854" marker-end="url(#retro-loop-arrow-soft)"/>
      <path class="spoke" d="M371.746 291.829 L414.294 305.654" marker-end="url(#retro-loop-arrow-soft)"/>

      <!-- Curated spoke labels beside the line with a visible gap. -->
      <rect x="532" y="196" width="80" height="16" rx="4" fill="#f5f5f5"/>
      <text x="572" y="208" class="spoke-label">事件流水</text>
      <rect x="616" y="446" width="84" height="16" rx="4" fill="#f5f5f5"/>
      <text x="658" y="458" class="spoke-label">欠账台账</text>
      <rect x="310" y="318" width="84" height="16" rx="4" fill="#f5f5f5"/>
      <text x="352" y="330" class="spoke-label">基线快照</text>

      <!-- Stations -->
      <rect class="station" x="440" y="68" width="160" height="64" rx="6"/>
      <text x="520" y="94" class="node-name">记账</text>
      <text x="520" y="116" class="sublabel">扩展自动写事实</text>

      <rect class="station" x="668" y="234" width="160" height="64" rx="6"/>
      <text x="748" y="260" class="node-name">报告</text>
      <text x="748" y="282" class="sublabel">只读 · 六段聚类</text>

      <rect class="station" x="580" y="502" width="160" height="64" rx="6"/>
      <text x="660" y="528" class="node-name">改进项</text>
      <text x="660" y="550" class="sublabel">可回检指标 · 观察窗口</text>

      <rect class="station" x="300" y="502" width="160" height="64" rx="6"/>
      <text x="380" y="528" class="node-name">改规则</text>
      <text x="380" y="550" class="sublabel">走 openspec change</text>

      <rect class="station focal" x="212" y="234" width="160" height="64" rx="6"/>
      <text x="292" y="260" class="node-name focal-name">基线回检</text>
      <text x="292" y="282" class="sublabel">--baseline 对比</text>

      <!-- The one shared-state hub. -->
      <rect class="hub" x="420" y="288" width="200" height="104" rx="8"/>
      <text x="520" y="336" class="hub-name">事实账本</text>
      <text x="520" y="360" class="hub-sub">events.db · 30d TTL</text>

      <!-- Legend: horizontal strip at the bottom. -->
      <line x1="40" y1="656" x2="1000" y2="656" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="676" class="legend-title">LEGEND</text>
      <path d="M60 700 A36 36 0 0 1 96 688" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#retro-loop-arrow)"/>
      <text x="108" y="702" class="legend-item">流程推进（顺时针）</text>
      <line x1="288" y1="695" x2="324" y2="695" stroke="#7a8399" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#retro-loop-arrow-soft)"/>
      <text x="336" y="702" class="legend-item">写回事实账本</text>
      <rect x="478" y="690" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="500" y="702" class="legend-item">改进关口（人工判定）</text>
    </svg>
  </main>
</body>
</html>
