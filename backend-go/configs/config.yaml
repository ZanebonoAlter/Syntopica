server:
  # 5100：避开 Windows 5000 端口 WSD/svchost 保留段冲突（该冲突为 Windows 特有；
  #      Linux/macOS 沿用同一默认值以保持跨平台一致）
  port: "5100"
  mode: "debug"

database:
  driver: "postgres"
  dsn: "host=127.0.0.1 user=postgres password=postgres dbname=syntopica port=5432 sslmode=disable TimeZone=Asia/Shanghai"
  postgres:
    # 连接池（fix-radar-overview-false-zero T1.2）：雷达总览一次要打十几条查询、
    # 13 个版块并发取数，全部抢这些连接——连接不够就在池里排队（Pi 上每次建连要
    # fork + 认证，排队 = 白等）。idle 5→25：突发后连接不被销毁，下次突发不必
    # 重新握手；open 25→40：PG max_connections=100 内安全，给后台任务留余量。
    # 改动需重启后端才生效。
    max_idle_conns: 25
    max_open_conns: 40
    conn_max_lifetime_minutes: 60
    conn_max_idle_time_minutes: 10
  # allow_destructive_migrations is intentionally NOT set here — it is only
  # enabled via the env override MIGRATIONS_ALLOW_DESTRUCTIVE=1 (dev/test).
  # Production never sets it, refusing destructive (TRUNCATE/DROP) migrations.
  # See docs/reference/deployment.md#破坏性迁移开关.

cors:
  origins:
    - "http://localhost:3000"
    - "http://localhost:3001"
  methods:
    - "GET"
    - "POST"
    - "PUT"
    - "PATCH"
    - "DELETE"
    - "OPTIONS"
  allow_headers:
    - "Content-Type"
    - "Authorization"

log:
  level: "info"
  file:
    enabled: true
    path: "logs/app.log"
    max_size_mb: 50
    max_backups: 30
    max_age_days: 30
    compress: true

storage:
  # Root directory for locally downloaded feed icons (served at /icons).
  icon_dir: "data/icons"

# 博查 Bocha web search（数据增强 web_search 后端；无 key 时优雅降级回 Noop）
bocha:
  api_key: ""        # 在此填入博查 key，或设环境变量 BOCHA_API_KEY
  endpoint: "https://api.bochaai.com/v1/web-search"

# 跨版块关系发现全局预算（add-evidence-backed-cross-board-relations）
cross_board_rel:
  # 单次 run 总超时。scout plan/extract + resolve + verify 两步都是 LLM 调用，
  # glm-5.3-flash 单步可达 150s+，默认 300s 会在 verify 阶段撞墙 → 900s。
  run_timeout_seconds: 900

# 实体主体归一（normalize-event-subject-entities）
# off    = 完全关闭：第一轮提示/schema/调用数逐字不变、零二轮调用、零实体层写入
# shadow = 影子态（实验态，2026-11-10 决策默认 off）：第一轮同次多产出稳定短身份说明，
#          写入仅限实体层（entity_registry/entity_mentions/entity_aux_links）、
#          正常 AI 审计、topic_tags.metadata.entity_subject 惰性键
# active = 本期未实现，显式报错拒绝（不会静默按 shadow 执行）
entity_subject:
  mode: off
