server:
  port: "5000"
  mode: "debug"

database:
  driver: "postgres"
  dsn: "host=127.0.0.1 user=postgres password=postgres dbname=syntopica port=5432 sslmode=disable TimeZone=Asia/Shanghai"
  postgres:
    max_idle_conns: 5
    max_open_conns: 25
    conn_max_lifetime_minutes: 60
    conn_max_idle_time_minutes: 10
  # allow_destructive_migrations is intentionally NOT set here — it is only
  # enabled via the env override MIGRATIONS_ALLOW_DESTRUCTIVE=1 (dev/test).
  # Production never sets it, refusing destructive (TRUNCATE/DROP) migrations.
  # See docs/reference/deployment.md#破坏性迁移开关.

cors:
  origins:
    - "http://localhost:3000"
    - "http://localhost:3001"
  methods:
    - "GET"
    - "POST"
    - "PUT"
    - "PATCH"
    - "DELETE"
    - "OPTIONS"
  allow_headers:
    - "Content-Type"
    - "Authorization"

log:
  level: "debug"
  file:
    enabled: true
    path: "logs/app.log"
    max_size_mb: 50
    max_backups: 30
    max_age_days: 30
    compress: true

storage:
  # Root directory for locally downloaded feed icons (served at /icons).
  icon_dir: "data/icons"

# 博查 Bocha web search（数据增强 web_search 后端；无 key 时优雅降级回 Noop）
bocha:
  api_key: ""        # 在此填入博查 key，或设环境变量 BOCHA_API_KEY
  endpoint: "https://api.bochaai.com/v1/web-search"

# 跨版块关系发现全局预算（add-evidence-backed-cross-board-relations）
cross_board_rel:
  # 单次 run 总超时。scout plan/extract + resolve + verify 两步都是 LLM 调用，
  # glm-5.3-flash 单步可达 150s+，默认 300s 会在 verify 阶段撞墙 → 900s。
  run_timeout_seconds: 900
