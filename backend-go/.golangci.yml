# ============================================================================
# internal/models 共享模型白名单（唯一权威登记处）
# 规则：internal/models 只保留被 2 个及以上业务域引用的共享模型
# （spec backend-package-boundaries「共享模型白名单」）。
# 单域独占模型必须定义在所属域 models/ 子包；新增/移除白名单项须在
# 同 change 内更新本注释（模型名 | 消费域 | 理由）。
# decouple-backend-domains 后基线（18 项 + 1 例外）：
#   多业务域共享（12）：
#     AISettings          | admin/dataenrichment/topicgraph… | AI 设置 KV，全域读
#     Article             | reader/tagmanagement/topicgraph… | 文章主实体
#     ArticleTopicTag     | reader/tagmanagement/topicgraph  | 文章-标签关联
#     Category            | reader                            | 与 Feed 组合消费（Feed 共享连带）
#     EmbeddingQueue      | tagmanagement/admin              | 嵌入队列
#     Feed                | reader/tagmanagement/discovery…  | 订阅源主实体
#     FirecrawlJob        | reader/admin(dataenrichment)     | 抓取任务
#     ReadingBehavior     | admin/reader                     | 阅读行为
#     SemanticLabel       | tagmanagement/discovery/topicgraph | 语义标签
#     TagJob              | tagmanagement/admin              | 标签任务队列
#     TopicTag            | tagmanagement/discovery/topicgraph | 标签主实体
#     TopicTagRelation    | tagmanagement/topicgraph         | 标签关系
#   跨 platform 层共享（6）：
#     AIProvider          | admin + platform/airouter        | 路由配置
#     AIRoute             | admin + platform/airouter        | 路由配置
#     AIRouteProvider     | admin + platform/airouter        | 路由配置
#     AICallLog           | admin + platform/airouter        | 调用日志
#     AIEmbeddingCache    | tagmanagement + platform/airouter | 嵌入缓存
#     Notification        | admin/topicgraph + platform/notification | 通知
#   例外（非 GORM 表，登记留痕）：
#     FeedStats           | reader 独占；Feed.ToDict 签名耦合（方法须定义在
#                          | Feed 所在包），非 GORM 模型不触发「单域模型
#                          | 不落在 models」场景，暂留并以此注释为准。
# ============================================================================

run:
  tests: false


formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - _test\.go
