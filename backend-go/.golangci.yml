version: "2"

linters:
  enable:
    - depguard
    - staticcheck
    - revive
    - gosec
    - errcheck
    - gocritic
    - unused
    - govet
    - ineffassign

  exclusions:
    rules:
      # 测试文件豁免（v2 迁移自 v1 issues.exclude-rules；depguard 不在此列——
      # 各 boundary 规则的 !$test 已排除测试文件）。
      - path: _test\.go
        linters: [gosec, errcheck, staticcheck, gocritic, govet]
      # 豁免留痕（spec backend-package-boundaries「豁免留痕」）：
      # datasources/wiring→dataenrichment/service 是 datasources↔dataenrichment
      # 结构性互嵌的一半（另一半 dataenrichment/wire.go→datasources/wiring）；
      # 改走 dataenrichment root 门面会形成 root 环（wiring→root→wire→wiring）。
      # change: decouple-backend-domains（2026-09-26 登记）
      # 解除条件：后续 change 拆解两域互嵌（回调反转/注入）后删除本条豁免。
      - path: internal/datasources/wiring/(register|tools)\.go
        linters: [depguard]

  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

    depguard:
      rules:
        # spec: backend-package-boundaries「业务域之间只许 import 对方 root 门面包」。
        # 每条规则=一个发起方域：deny 其余 6 域的 handler/service/repository/models
        # 深路径（含子包，前缀匹配）；域内分层自由；app 装配层 / platform 基础设施 /
        # models 共享层不匹配任何规则故天然豁免；$test 排除测试文件（对应 spec
        # Scenario「测试文件豁免深路径」）。
        # 临时豁免登记处：在对应 deny 项旁加注释（change 名 + 解除条件），
        # 无注释的豁免视为违规（spec「豁免留痕」）。
        admin-boundary:
          files:
            - "**/internal/admin/**"
            - "!$test"
          deny:
            - pkg: syntopica-backend/internal/reader/handler
              desc: "跨域深路径 import 禁止：只许 import 对方 root 门面包（如 syntopica-backend/internal/tagmanagement）；模型引用经 root re-export。见 spec backend-package-boundaries / change decouple-backend-domains。"
            - pkg: syntopica-backend/internal/reader/service
              desc: "跨域深路径 import 禁止：只许 import 对方 root 门面包（如 syntopica-backend/internal/tagmanagement）；模型引用经 root re-export。见 spec backend-package-boundaries / change decouple-backend-domains。"
            - pkg: syntopica-backend/internal/reader/repository
              desc: "跨域深路径 import 禁止：只许 import 对方 root 门面包（如 syntopica-backend/internal/tagmanagement）；模型引用经 root re-export。见 spec backend-package-boundaries / change decouple-backend-domains。"
            - pkg: syntopica-backend/internal/reader/models
              desc: "跨域深路径 import 禁止：只许 import 对方 root 门面包（如 syntopica-backend/internal/tagmanagement）；模型引用经 root re-export。见 spec backend-package-boundaries / change decouple-backend-domains。"
            - pkg: syntopica-backend/internal/tagmanagement/handler
              desc: "跨域深路径 import 禁止：只许 import 对方 root 门面包（如 syntopica-backend/internal/tagmanagement）；模型引用经 root re-export。见 spec backend-package-boundaries / change decouple-backend-domains。"
