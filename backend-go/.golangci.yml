            - pkg: syntopica-backend/internal/tagmanagement/models
              desc: "跨域深路径 import 禁止：只许 import 对方 root 门面包（如 syntopica-backend/internal/tagmanagement）；模型引用经 root re-export。见 spec backend-package-boundaries / change decouple-backend-domains。"
