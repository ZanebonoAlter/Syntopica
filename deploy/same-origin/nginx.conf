# Syntopica 同源反代入口 · nginx（dev 模式变体）
#
# 与同目录 Caddyfile.dev 等价：前端继续跑 Pi 上的 Nuxt dev server（:3000，保留 HMR），
# nginx 把前端与后端拼成同一个 origin，浏览器只面对一个地址。
#   同源 → 后端 CORS 白名单不参与，前端也不必在启动时写死主机地址。
#
# 安装：sudo bash deploy/same-origin/install-nginx.sh dev
# 前端：cd front && NUXT_PUBLIC_API_BASE=/api pnpm dev --host   （必须带这个变量重启）
# 访问：http://<pi-ip>/      （不是 :3000）
#
# 为什么需要这个文件而不是 Nitro devProxy：h3 的 proxyRequest 不处理 WebSocket
# upgrade（/ws 是事件流，HMR 也是 WS），实测否决，见
# openspec/changes/archive/2026-09-16-fix-wsl-dev-networking/design.md D2。

# WebSocket 升级：$connection_upgrade 在非 WS 请求下取 close，避免把普通请求
# 误标为长连接（nginx 1.26 直接写死 "upgrade" 会拖住 keepalive）。
map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	# 默认站点：`server_name _` 之外再占 default_server，避免 Debian 默认站点
	# 抢走请求（安装脚本会移除 sites-enabled/default，否则两个 default_server
	# 会直接导致 nginx -t 报 "a duplicate default server"）。
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	# OPML 导入 / 备份恢复等上传
	client_max_body_size 32m;

	# ── 公共代理头（在 server 级声明，各 location 继承）──
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection $connection_upgrade;
	# AI 摘要 / 流式响应不能被缓冲，且单次 LLM 调用可达数分钟
	proxy_buffering off;
	proxy_read_timeout 3600s;
	proxy_send_timeout 3600s;

	# ── 后端 5100：/api /icons /health ──
	# 锚定前缀 + `(/|$)`：/apixyz、/api-docs 这类 SPA 路由不会被吞掉
	location ~ ^/(api|icons|health)(/|$) {
		proxy_pass http://127.0.0.1:5100;
	}

	# ── 后端 5100：WebSocket 事件流（/ws）──
	location = /ws {
		proxy_pass http://127.0.0.1:5100;
	}

	# ── 前端：Nuxt dev server（含 Vite HMR 的 WebSocket）──
	location / {
		proxy_pass http://127.0.0.1:3000;
	}
}
