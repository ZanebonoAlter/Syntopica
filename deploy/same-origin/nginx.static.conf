# Syntopica 同源反代入口 · nginx（静态产物变体）
#
# 与同目录 Caddyfile 等价：nginx 直接托管前端静态产物（无 HMR、不需要 dev server），
# 后端四条路径转发到 127.0.0.1:5100。同源 → 无 CORS、无 apiBase 配置。
#
# 安装：
#   1. 构建：cd front && NUXT_PUBLIC_API_BASE=/api pnpm generate
#      （静态 SPA 的 runtimeConfig.public 在构建期内联，必须在构建期给这个变量）
#   2. 铺产物：sudo mkdir -p /srv/www && sudo cp -r front/.output/public/. /srv/www/
#   3. 装入口：sudo bash deploy/same-origin/install-nginx.sh static
# 访问：http://<pi-ip>/

map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	root /srv/www;
	index index.html;

	client_max_body_size 32m;

	# 静态资产压缩（产物是 JS/CSS 文本 + ~490 个 woff2 分片，gzip 收益明显）
	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/plain text/css application/javascript application/json
	           image/svg+xml application/wasm;

	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection $connection_upgrade;
	proxy_buffering off;
	proxy_read_timeout 3600s;
	proxy_send_timeout 3600s;

	location ~ ^/(api|icons|health)(/|$) {
		proxy_pass http://127.0.0.1:5100;
	}

	location = /ws {
		proxy_pass http://127.0.0.1:5100;
	}

	# 带哈希的构建产物可长缓存；index.html 与 SPA 兜底必须不缓存
	location /_nuxt/ {
		expires 30d;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	# SPA 兜底：刷新深层路由（/tags、/settings）不能 404
	location / {
		add_header Cache-Control "no-cache";
		try_files $uri $uri/ /index.html;
	}
}
